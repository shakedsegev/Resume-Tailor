services:
  - type: web
    name: resume-tailor
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/auth/me
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: CHROME_PATH
        value: /usr/bin/chromium
